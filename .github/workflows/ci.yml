name: Frontend checks
on:
  pull_request:
    branches: [dev, main]
    paths: ['src/**', 'tests/**', 'package*.json', 'vite.config.js', 'svelte.config.js', 'index.html', 'Dockerfile', '.github/workflows/ci.yml']
  push:
    branches: [dev]
    paths: ['src/**', 'tests/**', 'package*.json', 'vite.config.js', 'svelte.config.js', 'index.html', 'Dockerfile', '.github/workflows/ci.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build
        env:
          APP_THEME: flight
